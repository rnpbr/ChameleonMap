# Hashed build files (main.<16 hex>.js, styles.<16 hex>.css, ...) never
# change, so browsers may keep them; index.html must be revalidated so a
# new deploy is picked up. "expires" (not add_header) keeps any headers
# set by the upstream nginx intact.
map $uri $static_expires {
    default                                        off;
    "~*\.[0-9a-f]{16}\.(js|css|png|jpg|svg|woff2?)$" max;
    /                                              epoch;
    /index.html                                    epoch;
}

upstream normal {
    server nginx:80;
}

server {
    listen 80;
    server_name <site_name>;
    return 301 https://<site_name>$request_uri;
}

server {
    listen 443 ssl;
    server_name <site_name>;
    ssl_certificate <certificate.crt>;
    ssl_certificate_key <certificate_key.key>;
    
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
    client_max_body_size 30M;

    # Compress text responses on the way out, including what the
    # upstream nginx proxies (the map API's JSON is several MB).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;

    expires $static_expires;

    ssl_ciphers  "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+aRSA+RC4 EECDH EDH+aRSA RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS";
    ssl_prefer_server_ciphers   on;
    #ssl_dhparam /etc/ssl/nginx/dhparams.pem;
    ssl_protocols TLSv1.2;

    location / {
        proxy_pass http://nginx;
    }

}

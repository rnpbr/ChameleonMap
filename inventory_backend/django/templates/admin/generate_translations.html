{% extends "admin/base_site.html" %}
{% load get_languages %}
{% block content_title %}
  <h1>Generate translations for all elements</h1>
{% endblock %}

{% block content %}
<div id = "gentranslations-page">

  <div id = "gentranslations-form" class = "gentranslations-form">
    <form method="POST" action="{% url 'tenant_admin:generate_translations' %}">
      <div class="gentranslations-language-selector">
        {% csrf_token %}
        <label id="gentranslations-language-selector-label" for="gentranslations-targetLanguage">
          Target Language
        </label>
        <select id="gentranslations-language-selector-box" name="targetLanguage">
          {% getLanguageOptions as languageOptions %}
          {% for language in languageOptions %}
          {% getLanguageLabelFromCode language as languageLabel %}
          <option value="{{ language }}">{{ languageLabel }}</option>
          {% endfor %}
        </select>
      </div>
      
      <button id = "gentranslations-button" type = "submit">
        <div id = "gentranslations-button-icon">🌐</div>
        <div id = "gentranslations-button-text">Generate Translations</div>      
      </button>     
    </form>
  </div>
  <div id = "gentranslations-info-text">
    ℹ: Elements that already contain translation for target language will be skipped.
  </div>

  <div id = "gentranslations-progress" hidden>
    <progress id = "gentranslations-progress-bar" value = "0" max = "1"></progress>
    <div id = "gentranslations-progress-text"></div>
  </div>
  <div id = "gentranslations-result" hidden></div>

  <div id = "gentranslations-loading-animation">
    <div id = "gentranslations-loading-animation-globe">
      🌐
    </div>
    <div id = "gentranslations-loading-animation-chameleon">
      <img id = "gentranslations-loading-animation-chameleon-image" src = "https://i.imgur.com/65Yiw9X.png">
    </div>
    <div id = "gentranslations-loading-animation-text">
      <div class = "gentranslations-loading-animation-text-content" id = "gentranslations-loading-animation-text-label">
        Translating
      </div>
      <div class = "gentranslations-loading-animation-text-content" id = "gentranslations-loading-animation-text-point-1">
        .
      </div>
      <div class = "gentranslations-loading-animation-text-content" id = "gentranslations-loading-animation-text-point-2">
        .
      </div>
      <div class = "gentranslations-loading-animation-text-content" id = "gentranslations-loading-animation-text-point-3">
        .
      </div>
    </div>
  </div>
</div>

<script>
  const loadingAnimation = document.getElementById('gentranslations-loading-animation')
  loadingAnimation.style.visibility = 'hidden'
  
  setTimeout(() => {
    const loadingAnimationChameleon = document.getElementById('gentranslations-loading-animation-chameleon')
    const loadingAnimationGlobe = document.getElementById('gentranslations-loading-animation-globe')
    const heightGlobe = loadingAnimationGlobe.getBoundingClientRect().height;
    const heightChameleon = loadingAnimationChameleon.getBoundingClientRect().height;

    loadingAnimationChameleon.style.bottom = `${(heightGlobe+heightChameleon)/2.0}px`
  }, 2);
  
  const progressContainer = document.getElementById('gentranslations-progress')
  const progressBar = document.getElementById('gentranslations-progress-bar')
  const progressText = document.getElementById('gentranslations-progress-text')
  const resultMessage = document.getElementById('gentranslations-result')

  function setRunning(running) {
    const generateTranslationsPage = document.getElementById('gentranslations-page')
    const formContainer = document.getElementById('gentranslations-form')

    loadingAnimation.style.visibility = running ? 'visible' : 'hidden'
    formContainer.style.pointerEvents = running ? 'none' : ''
    formContainer.classList.toggle('blocked', running)
    generateTranslationsPage.style.cursor = running ? 'progress' : ''
  }

  function showProgress(done, total, model) {
    const percent = total ? Math.floor(done * 100 / total) : 100
    progressBar.max = total || 1
    progressBar.value = total ? done : 1
    progressText.textContent = `${done} / ${total} (${percent}%)` + (model ? ` · ${model}` : '')
  }

  function showResult(message, isError) {
    resultMessage.textContent = message
    resultMessage.classList.toggle('gentranslations-result-error', isError)
    resultMessage.hidden = false
  }

  document.querySelector('#gentranslations-form form').addEventListener('submit', async (event) => {
    event.preventDefault()
    const form = event.target
    const languageLabel = form.targetLanguage.selectedOptions[0].text
    let progress = { done: 0, total: 0 }
    let finished = false

    const handleEvent = (data) => {
      if (data.type === 'start') {
        progress.total = data.total
        showProgress(0, data.total)
      } else if (data.type === 'progress') {
        progress = data
        showProgress(data.done, data.total, data.model)
      } else if (data.type === 'done') {
        finished = true
        showProgress(data.done, data.total)
        showResult(data.total
          ? `${data.done} translations generated for ${languageLabel}.`
          : `Nothing to translate: every element already has a ${languageLabel} translation.`, false)
      } else if (data.type === 'error') {
        finished = true
        showResult(`Error after ${progress.done} of ${progress.total} elements: ${data.message}. ` +
          'Translations already generated were kept; run again to continue.', true)
      }
    }

    resultMessage.hidden = true
    progressContainer.hidden = false
    progressBar.removeAttribute('value')
    progressText.textContent = 'Starting...'
    setRunning(true)
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/x-ndjson' },
      })
      if (!response.ok) throw new Error(`HTTP ${response.status}`)

      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ''
      while (true) {
        const { value, done } = await reader.read()
        if (done) break
        buffer += decoder.decode(value, { stream: true })
        const lines = buffer.split('\n')
        buffer = lines.pop()
        lines.filter((line) => line.trim()).forEach((line) => handleEvent(JSON.parse(line)))
      }
      if (!finished) throw new Error('connection closed before finishing')
    } catch (error) {
      showResult(`Error generating translations: ${error.message}. ` +
        'Translations already generated were kept; run again to continue.', true)
    } finally {
      setRunning(false)
    }
  });
</script>

<style>
  .gentranslations-language-selector{
    display: inline-block;
  }
  #gentranslations-language-selector-box{
    cursor: pointer;
  }
  #gentranslations-language-selector-label{
    font-size: .8125rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  #gentranslations-button{
    cursor: pointer;
    font-size: .9375rem;
    font-weight: 600;
    display: inline-block;
    vertical-align: middle;
    border-color: #f9fafb;
    border-width: 2px;
    border-radius: 10px;
    padding-right: 5px;
    transition: transform 1s;
  }
  #gentranslations-button:hover  { 
    opacity: .88; 
  }
  #gentranslations-button:active { 
    transform: scale(.97); 
  }
  #gentranslations-button-icon {
    font-size: 2rem;
    display: inline;
    vertical-align: center;
  }
  #gentranslations-button-text {
    display: inline;
    vertical-align: center;
  }

  #gentranslations-loading-animation{
    position: absolute;
    top: 50vh;
    left: 50vw;
    min-width: min-content;
  }  
  #gentranslations-loading-animation-globe{
    position: relative;
    font-size: 5rem;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 0 10px rgba(80,180,255,0.7));
    animation: pulse 2.5s linear infinite;
    z-index:1000;
  }
  #gentranslations-loading-animation-chameleon{
    position: relative;
    display: grid;
    place-items: center;
    animation: orbitate 2s linear infinite;
  }
  #gentranslations-loading-animation-chameleon-image{
    height: 2rem;
  }
  
  .gentranslations-loading-animation-text-content{
    display: inline;
    font-weight: 900;
  }
  #gentranslations-loading-animation-text{
    min-width: min-content;
    white-space: nowrap;
  }
  #gentranslations-loading-animation-text-label{
    animation: fade 1s infinite alternate;
  }
  #gentranslations-loading-animation-text-point-1{
    animation: blink50 1s infinite alternate;
  }  
  #gentranslations-loading-animation-text-point-2{
    animation: blink70 1s infinite alternate;
  }
  #gentranslations-loading-animation-text-point-3{
    animation: blink90 1s infinite alternate;
  }

  #gentranslations-info-text{
    line-height: 1.625;
    font-size: 0.75rem;
    margin-top: 0.50rem;
    font-style: italic;
  }

  #gentranslations-progress{
    margin-top: 1rem;
    max-width: 480px;
  }
  #gentranslations-progress-bar{
    width: 100%;
    height: 0.75rem;
    accent-color: #2563eb;
  }
  #gentranslations-progress-text{
    font-size: 0.8125rem;
    margin-top: 0.25rem;
  }
  #gentranslations-result{
    margin-top: 0.75rem;
    font-weight: 600;
    color: #16a34a;
  }
  #gentranslations-result.gentranslations-result-error{
    color: #dc2626;
  }

  @keyframes orbitate{
    from{
      transform: rotate(0deg) translateY(4.5rem) rotate(0deg) scale(1);
    }
    50%{
      transform: rotate(180deg) translateY(4.2rem) rotate(-180deg) scale(0.5);
    }
    to{
      transform: rotate(360deg) translateY(4.5rem) rotate(-360deg) scale(1);
    }
  }

  @keyframes pulse{
    0%,100%{
      transform: scale(1)
    }
    50%{
      transform: scale(1.08)
    }
  }
  @keyframes fade{
    from{
      opacity: 1;
    }
    to{
      opacity: 0.7;
    }
  }

  @keyframes blink50{
    from{
      opacity: 0;
    }
    50%{
      opacity: 1;
    }
    to{
      opacity: 1;
    }
  }
  @keyframes blink70{
    from{
      opacity: 0;
    }
    70%{
      opacity: 1;
    }
    to{
      opacity: 1;
    }
  }
  @keyframes blink90{
    from{
      opacity: 0;
    }
    90%{
      opacity: 1;
    }
    to{
      opacity: 1;
    }
  }

  .translation-header {
    display: flex;
    gap: 1rem;
  }  
  
  .blocked{
    filter: grayscale(100%);
    opacity: 0.8;
  }
</style>

{% endblock %}
